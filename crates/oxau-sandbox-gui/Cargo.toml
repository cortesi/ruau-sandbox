[package]
name = "oxau-sandbox-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
default-run = "oxau-sandbox-gui"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oxau-sandbox-gui"
path = "src/main.rs"

[[bin]]
name = "oxau-sandbox-web"
path = "src/web.rs"

[features]
default = []
devtools = ["dep:eguidev_runtime"]

[dependencies]
oxau-sandbox.workspace = true
anyhow = "1.0.100"
eframe = { version = "0.34.3", features = ["glow"] }
egui = "0.34.3"
eguidev = { version = "0.0.2", path = "/Users/cortesi/git/public/eguidev/crates/eguidev" }
eguidev_runtime = { version = "0.0.2", path = "/Users/cortesi/git/public/eguidev/crates/eguidev_runtime", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "=0.4.75"
web-sys = { version = "=0.3.102", features = [
    "Document",
    "HtmlCanvasElement",
    "Window",
] }
