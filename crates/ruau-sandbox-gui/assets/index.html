<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ruau Sandbox</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101218;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            left: 16px;
            bottom: 16px;
            color: #eaedf3;
            font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
        }
    </style>
</head>
<body>
    <canvas id="ruau-sandbox"></canvas>
    <div id="loading">Loading...</div>
    <script type="module">
        import init from '/api/wasm.js';
        init('/api/wasm.wasm').then(() => {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
        }).catch(console.error);
    </script>
</body>
</html>
