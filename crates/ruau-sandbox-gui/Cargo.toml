[package]
name = "ruau-sandbox-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
default-run = "ruau-sandbox-gui"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "ruau-sandbox-gui"
path = "src/main.rs"

[[bin]]
name = "ruau-sandbox-web"
path = "src/web.rs"

[features]
default = []
devtools = ["dep:eguidev_runtime"]

[dependencies]
ruau-sandbox.workspace = true
anyhow = "1.0.100"
eframe = { version = "0.36.0", features = ["glow"] }
egui = "0.36.0"
eguicode = { path = "../../../../public/eguicode/crates/eguicode" }
eguidev = { version = "0.1.0", path = "../../../../public/eguidev/crates/eguidev" }
eguidev_runtime = { version = "0.1.0", path = "../../../../public/eguidev/crates/eguidev_runtime", optional = true }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5.56", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = { version = "=0.3.103", features = [
    "Document",
    "HtmlCanvasElement",
    "Window",
] }
