[workspace.package]
authors = ["Aldo Cortesi <aldo@corte.si>"]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A wasm-capable Ruau sandbox for editing, checking, and running Rust-like snippets."

[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
default-members = ["crates/ruau-sandbox-gui"]

[workspace.dependencies]
ruau-sandbox = { path = "crates/ruau-sandbox", version = "0.1.0" }
ruau-sandbox-gui = { path = "crates/ruau-sandbox-gui", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
absolute_paths = "warn"
branches_sharing_code = "warn"
ignore_without_reason = "warn"
let_underscore_must_use = "warn"
many_single_char_names = "warn"
missing_docs_in_private_items = "warn"
multiple_inherent_impl = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
self_named_module_files = "warn"
tests_outside_test_module = "warn"
use_self = "warn"
wildcard_dependencies = "warn"
cfg_not_test = "warn"
comparison_chain = "warn"
items_after_statements = "warn"
needless_pass_by_ref_mut = "warn"

cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"

[patch.crates-io]
tmcp = { path = "/Users/cortesi/git/public/tmcp/crates/tmcp" }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
